<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ilustración de café tinto">
  <defs>
    <linearGradient id="ctBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6EEE4"/>
      <stop offset="1" stop-color="#E4D3C0"/>
    </linearGradient>
    <linearGradient id="ctLiq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6B3F22"/>
      <stop offset="1" stop-color="#33190C"/>
