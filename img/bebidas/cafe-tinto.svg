  </defs>

  <rect width="600" height="600" fill="url(#ctBg)"/>
  <circle cx="470" cy="110" r="110" fill="#6B3F22" opacity=".2"/>
  <circle cx="110" cy="500" r="90" fill="#C9A538" opacity=".18"/>
  <rect y="470" width="600" height="130" fill="#8B5E34" opacity=".32"/>

  <!-- Vapor -->
  <g fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" opacity=".75">
    <path d="M255 200c30-34-30-58 0-94"/>
    <path d="M345 195c30-34-30-58 0-94"/>
  </g>

  <ellipse cx="300" cy="500" rx="180" ry="42" fill="#000" opacity=".14"/>

  <!-- Plato -->
  <ellipse cx="290" cy="478" rx="185" ry="46" fill="#FFFFFF"/>
  <ellipse cx="290" cy="470" rx="185" ry="46" fill="#FFFDF7"/>
  <ellipse cx="290" cy="470" rx="120" ry="28" fill="#F0E7D8"/>

  <!-- Taza -->
  <path d="M185 250h215l-22 190a72 72 0 0 1-71 64h-29a72 72 0 0 1-71-64z" fill="#FFFFFF"/>
  <path d="M185 250h215l-6 52H191z" fill="#F7F2E8"/>
  <ellipse cx="292" cy="250" rx="107" ry="30" fill="#FFFDF7"/>
  <ellipse cx="292" cy="250" rx="92" ry="24" fill="url(#ctLiq)"/>
  <ellipse cx="272" cy="244" rx="34" ry="11" fill="#8A5630" opacity=".7"/>

  <!-- Asa -->
  <path d="M400 300c66 0 66 96 0 96" fill="none" stroke="#FFFFFF" stroke-width="26"/>
  <path d="M400 300c66 0 66 96 0 96" fill="none" stroke="#EDE6D8" stroke-width="10"/>

