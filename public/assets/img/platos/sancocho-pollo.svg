  </defs>

  <rect width="800" height="600" fill="url(#spBg)"/>
  <circle cx="700" cy="90" r="130" fill="#C9A538" opacity=".16"/>
  <circle cx="80" cy="520" r="110" fill="#5C8C4A" opacity=".12"/>
  <rect y="505" width="800" height="95" fill="#8B5E34" opacity=".25"/>

  <!-- Vapor -->
  <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity=".6">
    <path d="M330 200c26-30-26-52 0-84"/>
    <path d="M470 200c26-30-26-52 0-84"/>
  </g>

  <ellipse cx="400" cy="505" rx="300" ry="58" fill="#000" opacity=".10"/>
  <ellipse cx="400" cy="486" rx="300" ry="58" fill="#F6F2E8"/>

  <!-- Tazón -->
  <path d="M165 292C165 432 265 482 400 482s235-50 235-190z" fill="url(#spBowl)"/>
  <ellipse cx="400" cy="292" rx="235" ry="80" fill="#FDFBF6"/>
  <!-- Caldo -->
  <ellipse cx="400" cy="292" rx="205" ry="66" fill="#E8B93F"/>
  <ellipse cx="400" cy="292" rx="205" ry="66" fill="#F0C64F" opacity=".7"/>

  <!-- Pollo -->
