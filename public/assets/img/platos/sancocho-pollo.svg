  <!-- Cilantro -->
  <g fill="#4F7F3F">
    <path d="M380 250c14-16 34-16 46-2-14 14-34 14-46 2z"/>
    <path d="M430 262c14-16 34-16 46-2-14 14-34 14-46 2z"/>
