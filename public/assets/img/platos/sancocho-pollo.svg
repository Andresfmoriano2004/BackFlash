    <path d="M265 285c0-32 30-52 62-44 26 7 40 30 34 54-6 24-32 38-60 32-24-5-36-24-36-42z" fill="#D79A4E"/>
    <rect x="243" y="300" width="70" height="26" rx="13" transform="rotate(28 278 313)" fill="#F2E3C6"/>
    <circle cx="322" cy="316" r="13" fill="#F7EFD9"/>
  </g>

  <!-- Mazorca -->
  <g transform="rotate(-18 470 300)">
